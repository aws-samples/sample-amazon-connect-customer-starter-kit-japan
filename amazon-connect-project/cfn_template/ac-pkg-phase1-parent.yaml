AWSTemplateFormatVersion: '2010-09-09'
Description: 'Amazon Connect Customer Instance with Customer Profiles and Amazon Connect AI agent'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Connect Instance Configuration"
        Parameters:
          - CreateNewInstance
          - InstanceAlias
          - ClaimPhoneNumber
          - ExistingInstanceId
      - Label:
          default: "Amazon Connect AI agents Configuration"
        Parameters:
          - EnableAmazonConnectAIagents
      - Label:
          default: "Package Auto Copy (GitHub to -app bucket)"
        Parameters:
          - EnablePackageAutoCopy
          - PackageGitHubRepository
          - PackageGitRef
    ParameterLabels:
      EnableAmazonConnectAIagents:
        default: "Enable Amazon Connect AI agents"

Parameters:
  CreateNewInstance:
    Type: String
    Description: 'Create a new Connect instance?'
    AllowedValues: 
      - 'Yes'
      - 'No'
    Default: 'Yes'
  
  InstanceAlias:
    Type: String
    Description: 'The instance alias for the Amazon Connect instance. Use only lowercase letters, numbers, and hyphens.'
    MaxLength: 64
    AllowedPattern: '^[a-z0-9-]+$'
    ConstraintDescription: 'Instance alias can only contain lowercase letters, numbers, and hyphens.'
  
  ExistingInstanceId:
    Type: String
    Description: 'Existing Connect instance ID (required if not creating a new Amazon Connect instance)'
    Default: ''
  
  EnableAmazonConnectAIagents:
    Type: String
    AllowedValues: 
      - 'Yes'
      - 'No'
    Default: 'Yes'
    Description: 'Enable or disable Connect AI agents domain creation. If you select No, you will need to use an existing Connect AI agents domain or create a Connect AI agents domain manually.'

  ClaimPhoneNumber:
    Type: String
    AllowedValues: 
      - 'Yes'
      - 'No'
    Default: 'Yes'
    Description: 'Claim a phone number on a new Amazon Connect instance. If no, manually claim it in the Admin console.'

  EnablePackageAutoCopy:
    Type: String
    AllowedValues:
      - 'Yes'
      - 'No'
    Default: 'Yes'
    Description: 'Copy the amazon-connect-project folder from GitHub into the -app S3 bucket during stack creation. If No, upload it manually as before.'

  PackageGitHubRepository:
    Type: String
    Default: 'aws-samples/sample-amazon-connect-customer-starter-kit-japan'
    AllowedPattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
    ConstraintDescription: 'Use the form owner/repository.'
    Description: 'GitHub repository (owner/repository) that contains the amazon-connect-project folder.'

  PackageGitRef:
    Type: String
    Default: 'main'
    AllowedPattern: '^[A-Za-z0-9_.-]+$'
    ConstraintDescription: 'Use a branch name, tag name or commit SHA (no slash).'
    Description: 'Branch, tag or commit SHA to copy from. Pinning a tag or commit SHA is recommended.'
  
Rules:
  ValidateInstanceAlias:
    RuleCondition: !Equals 
      - !Ref CreateNewInstance
      - 'Yes'
    Assertions:
      - Assert: !Not [!Equals [!Ref InstanceAlias, '']]
        AssertDescription: InstanceAlias must be provided when creating a new instance
  
  ValidateExistingInstanceId:
    RuleCondition: !Equals 
      - !Ref CreateNewInstance
      - 'No'
    Assertions:
      - Assert: !Not [!Equals [!Ref ExistingInstanceId, '']]
        AssertDescription: ExistingInstanceId must be provided when not creating a new instance

Conditions:
  ShouldCreateNewInstance: !Equals 
    - !Ref CreateNewInstance
    - 'Yes'
  ShouldClaimPhoneNumber: !Equals 
    - !Ref ClaimPhoneNumber
    - 'Yes'
  ShouldCreateNewInstanceAndClaimPhoneNumber:
    !And
      - !Condition ShouldCreateNewInstance
      - !Condition ShouldClaimPhoneNumber
  CreateAssistantResources: !Equals 
    - !Ref EnableAmazonConnectAIagents
    - 'Yes'
  ShouldCopyPackage: !Equals
    - !Ref EnablePackageAutoCopy
    - 'Yes'
  ShouldCopySampleKnowledge:
    !And
      - !Condition ShouldCopyPackage
      - !Condition CreateAssistantResources

Resources:

  # ========================================
  # 0. Connect Instance
  # ========================================
  ConnectInstance:
    Type: AWS::Connect::Instance
    Condition: ShouldCreateNewInstance
    Properties:
      Attributes: 
        AutoResolveBestVoices: true
        ContactLens: true
        ContactflowLogs: true
        EarlyMedia: true
        InboundCalls: true
        OutboundCalls: true
        UseCustomTTSVoices: false
      IdentityManagementType: CONNECT_MANAGED
      InstanceAlias: !Ref InstanceAlias

  ConnectPhoneNumber:
    Type: AWS::Connect::PhoneNumber
    Condition: ShouldCreateNewInstanceAndClaimPhoneNumber
    DependsOn: ConnectInstance
    Properties:
      CountryCode: US
      Type: DID
      TargetArn: !GetAtt ConnectInstance.Arn
      Description: "A US phone number for testing"

  # ========================================
  # 1. ロギング用バケット
  # ========================================
  LoggingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'amazonconnect-${InstanceAlias}-logs'
      OwnershipControls:
        Rules:
          - ObjectOwnership: ObjectWriter
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  # ========================================
  # 2. ロギング用バケットのポリシー
  # ========================================
  LoggingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DependsOn: LoggingBucket
    Properties:
      Bucket: !Ref LoggingBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowS3LogDelivery
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: 
              - s3:PutObject
            Resource: !Sub 'arn:aws:s3:::${LoggingBucket}/*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref 'AWS::AccountId'
          - Sid: AllowCloudFrontLogDelivery
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:PutObject'
            Resource: !Sub '${LoggingBucket.Arn}/*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref 'AWS::AccountId'

  # ========================================
  # 3. KMSキー
  # ========================================
  ConnectKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: 'KMS key for Amazon Connect Services'
      KeyPolicy:
        Version: '2012-10-17'
        Id: 'connect-key-policy'
        Statement:
          - Sid: 'Enable IAM User Permissions'
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: 'Allow Connect Services'
            Effect: Allow
            Principal:
              Service: 
                - 'connect.amazonaws.com'
                - 'profile.amazonaws.com'
            Action:
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey'
              - 'kms:GenerateDataKey*'
              - 'kms:DescribeKey'
            Resource: '*'
          - Sid: 'Allow S3 Service'
            Effect: Allow
            Principal:
              Service: 's3.amazonaws.com'
            Action:
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey'
            Resource: '*'
          - Sid: 'Allow Connect Call Recording'
            Effect: Allow
            Principal:
              Service: 'connect.amazonaws.com'
            Action:
              - 'kms:CreateGrant'
              - 'kms:Decrypt'
              - 'kms:DescribeKey'
              - 'kms:Encrypt'
              - 'kms:GenerateDataKey'
              - 'kms:GenerateDataKeyPair'
              - 'kms:GenerateDataKeyPairWithoutPlaintext'
              - 'kms:GenerateDataKeyWithoutPlaintext'
              - 'kms:ReEncryptFrom'
              - 'kms:ReEncryptTo'
            Resource: '*'
      EnableKeyRotation: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      Tags:
        - Key: Purpose
          Value: ConnectServices

  ConnectKMSAlias:
    Type: AWS::KMS::Alias
    DependsOn: ConnectKMSKey
    Properties:
      AliasName: !Sub 'alias/${AWS::StackName}-connect'
      TargetKeyId: !Ref ConnectKMSKey

  # ========================================
  # 4. その他のS3バケット
  # ========================================
  
  # Amazon Connect 用のS3バケット
  ConnectS3Bucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateNewInstance
    DependsOn: LoggingBucketPolicy
    Properties:
      BucketName: !Sub 'amazonconnect-${InstanceAlias}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref LoggingBucket
        LogFilePrefix: connect-bucket-logs/
      Tags:
        - Key: Purpose
          Value: ConnectRecordings

  # Amazon Connect Package用のS3バケット
  ConnectS3BucketApp:
    Type: AWS::S3::Bucket
    DependsOn: LoggingBucketPolicy
    Properties:
      BucketName: !Sub 'amazonconnect-${InstanceAlias}-app'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref LoggingBucket
        LogFilePrefix: connect-app-bucket-logs/
      Tags:
        - Key: Purpose
          Value: ConnectPackage

  # Amazon Connect AI agents ナレッジソース用のS3バケット
  ConnectS3BucketAIagents:
    Type: AWS::S3::Bucket
    Condition: CreateAssistantResources
    DependsOn: LoggingBucketPolicy
    Properties:
      BucketName: !Sub 'amazonconnect-${InstanceAlias}-aiagents'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref LoggingBucket
        LogFilePrefix: connect-aiagents-bucket-logs/
      Tags:
        - Key: Purpose
          Value: Amazon Connect AI agents Knowledge Source

  # ========================================
  # 5. バケットポリシー
  # ========================================
  
  # AmazonConnect用バケットのポリシー
  ConnectS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: ShouldCreateNewInstance
    DependsOn: ConnectS3Bucket
    Properties:
      Bucket: !Ref ConnectS3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowConnectAccess
            Effect: Allow
            Principal:
              Service: connect.amazonaws.com
            Action:
              - s3:PutObject
              - s3:GetObject
            Resource: !Sub '${ConnectS3Bucket.Arn}/*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref 'AWS::AccountId'

  # Amazon Connect Package用バケットのポリシー
  ConnectS3BucketAppPolicy:
    Type: AWS::S3::BucketPolicy
    DependsOn: ConnectS3BucketApp
    Properties:
      Bucket: !Ref ConnectS3BucketApp
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontAccess
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:GetObject'
            Resource: !Sub '${ConnectS3BucketApp.Arn}/*'

  # Connect AI agents 用S3バケットへのポリシー
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateAssistantResources
    DependsOn: ConnectS3BucketAIagents
    Properties:
      Bucket: !Ref ConnectS3BucketAIagents
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAppIntegrationsDataIntegrations
            Effect: Allow
            Principal:
              Service: app-integrations.amazonaws.com
            Action:
              - s3:ListBucket
              - s3:GetObject
              - s3:GetBucketLocation
            Resource:
              - !Sub 'arn:aws:s3:::${ConnectS3BucketAIagents}'
              - !Sub 'arn:aws:s3:::${ConnectS3BucketAIagents}/*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref 'AWS::AccountId'
              ArnEquals:
                aws:SourceArn: !Sub 'arn:aws:app-integrations:${AWS::Region}:${AWS::AccountId}:data-integration/*'

  # ========================================
  # 6. Connect Instance（ストレージ）
  # ========================================

  # Amazon Connect でVoice録音を有効化
  ConnectInstanceStorageConfigVoice:
    Type: AWS::Connect::InstanceStorageConfig
    Condition: ShouldCreateNewInstance
    DependsOn: 
      - ConnectInstance
      - ConnectS3BucketPolicy
    Properties:
      InstanceArn: !GetAtt ConnectInstance.Arn
      ResourceType: CALL_RECORDINGS
      StorageType: S3
      S3Config:
        BucketName: !Ref ConnectS3Bucket
        BucketPrefix: "CallRecordings"
        EncryptionConfig:
          EncryptionType: KMS
          KeyId: !GetAtt ConnectKMSKey.Arn

  # Amazon Connect でChat記録を有効化
  ConnectInstanceStorageConfigChat:
    Type: AWS::Connect::InstanceStorageConfig
    Condition: ShouldCreateNewInstance
    DependsOn: 
      - ConnectInstance
      - ConnectS3BucketPolicy
      - ConnectInstanceStorageConfigVoice
    Properties:
      InstanceArn: !GetAtt ConnectInstance.Arn
      ResourceType: CHAT_TRANSCRIPTS
      StorageType: S3
      S3Config:
        BucketName: !Ref ConnectS3Bucket
        BucketPrefix: "ChatTranscripts"
        EncryptionConfig:
          EncryptionType: KMS
          KeyId: !GetAtt ConnectKMSKey.Arn

  # Amazon Connect で評価を有効化
  ConnectContactEvaluationsStorageConfig:
    Type: AWS::Connect::InstanceStorageConfig
    Condition: ShouldCreateNewInstance
    DependsOn: 
      - ConnectInstance
      - ConnectS3BucketPolicy
      - ConnectInstanceStorageConfigVoice
      - ConnectInstanceStorageConfigChat
    Properties:
      InstanceArn: !GetAtt ConnectInstance.Arn
      ResourceType: CONTACT_EVALUATIONS
      StorageType: S3
      S3Config:
        BucketName: !Ref ConnectS3Bucket
        BucketPrefix: "ContactEvaluations"
        EncryptionConfig:
          EncryptionType: KMS
          KeyId: !GetAtt ConnectKMSKey.Arn

  # ========================================
  # 7. Customer Profiles & Cases
  # ========================================
  CustomerProfiles:
    Type: AWS::CustomerProfiles::Domain
    DependsOn: ConnectKMSKey
    Properties:
      DomainName: !If 
        - ShouldCreateNewInstance
        - !Sub '${InstanceAlias}-profiles-domain'
        - !Sub '${ExistingInstanceId}-profiles-domain'
      DefaultEncryptionKey: !GetAtt ConnectKMSKey.Arn
      DefaultExpirationDays: 730
      Tags: 
        - Key: "Environment"
          Value: "Production"

  AmazonConnectCases:
    Type: AWS::Cases::Domain
    Properties:
      Name: !If 
        - ShouldCreateNewInstance
        - !Sub '${InstanceAlias}-cases-domain'
        - !Sub '${ExistingInstanceId}-cases-domain'
      Tags: 
        - Key: "Environment"
          Value: "Production"

  # ========================================
  # 8. Amazon Connect AI agents Resources
  # ========================================
  DataIntegration:
    Type: 'AWS::AppIntegrations::DataIntegration'
    Condition: CreateAssistantResources
    DependsOn:
      - BucketPolicy
      - CustomerProfiles
    Properties:
      Name: !Sub 'aiagents-amazonconnect-${InstanceAlias}'
      KmsKey: !GetAtt ConnectKMSKey.Arn
      SourceURI: !Sub 's3://${ConnectS3BucketAIagents}'

  KnowledgeBase:
    Type: 'AWS::Wisdom::KnowledgeBase'
    Condition: CreateAssistantResources
    DependsOn: DataIntegration
    Properties:
      Name: !Sub 'aiagents-amazonconnect-${InstanceAlias}'
      KnowledgeBaseType: EXTERNAL
      Tags:
        - Key: AmazonConnectEnabled
          Value: "True"
      ServerSideEncryptionConfiguration:
        KmsKeyId: !GetAtt ConnectKMSKey.Arn
      SourceConfiguration:
        AppIntegrations:
          AppIntegrationArn: !GetAtt DataIntegration.DataIntegrationArn

  Assistant:
    Type: 'AWS::Wisdom::Assistant'
    Condition: CreateAssistantResources
    DependsOn: CustomerProfiles
    Properties:
      Name: !Sub 'aiagents-amazonconnect-${InstanceAlias}'
      Type: AGENT
      Description: 'Connect AI agents domain created via CloudFormation'
      ServerSideEncryptionConfiguration:
        KmsKeyId: !GetAtt ConnectKMSKey.Arn

  AssistantAssociation:
    Type: 'AWS::Wisdom::AssistantAssociation'
    Condition: CreateAssistantResources
    DependsOn:
      - KnowledgeBase
      - Assistant
    Properties:
      AssistantId: !Ref Assistant
      AssociationType: KNOWLEDGE_BASE
      Association:
        KnowledgeBaseId: !Ref KnowledgeBase

  # ========================================
  # 9. Package Auto Copy (GitHub -> -app バケット)
  #    amazon-connect-project フォルダを -app バケットへ自動コピーする。
  #    Phase3 の TemplateURL が参照する S3 パスを手動アップロードなしで用意する。
  # ========================================
  PackageCopyRole:
    Type: AWS::IAM::Role
    Condition: ShouldCopyPackage
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: PackageCopyToAppBucket
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource: !Sub '${ConnectS3BucketApp.Arn}/amazon-connect-project/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                Resource: !GetAtt ConnectS3BucketApp.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${ConnectS3BucketApp.Arn}/amazon-connect-project/sample_knowledge/*'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource: !Sub 'arn:aws:s3:::amazonconnect-${InstanceAlias}-aiagents/sample_knowledge/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                Resource: !Sub 'arn:aws:s3:::amazonconnect-${InstanceAlias}-aiagents'

  PackageCopyFunction:
    Type: AWS::Lambda::Function
    Condition: ShouldCopyPackage
    Properties:
      Description: 'Copies amazon-connect-project from GitHub into the -app S3 bucket'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt PackageCopyRole.Arn
      Timeout: 900
      MemorySize: 1024
      Code:
        ZipFile: |
          import boto3, io, mimetypes, urllib.request, zipfile
          import cfnresponse
          s3 = boto3.client('s3')
          P = 'amazon-connect-project/'
          def copy(b, repo, ref):
              u = 'https://codeload.github.com/%s/zip/%s' % (repo, ref)
              rq = urllib.request.Request(u, headers={'User-Agent': 'cfn-package-copy'})
              z = zipfile.ZipFile(io.BytesIO(urllib.request.urlopen(rq, timeout=120).read()))
              n = 0
              for i in z.infolist():
                  if i.is_dir():
                      continue
                  k = i.filename.split('/', 1)[-1]
                  if not k.startswith(P) or '..' in k.split('/'):
                      continue
                  s3.put_object(Bucket=b, Key=k, Body=z.read(i),
                                ContentType=mimetypes.guess_type(k)[0] or 'binary/octet-stream')
                  n += 1
              if n == 0:
                  raise Exception('%s not found in %s@%s' % (P, repo, ref))
              return n
          def s3copy(src, dst, sp, dp):
              n = 0
              for pg in s3.get_paginator('list_objects_v2').paginate(Bucket=src, Prefix=sp):
                  for o in pg.get('Contents', []):
                      if o['Key'].endswith('/'):
                          continue
                      s3.copy_object(Bucket=dst, Key=dp + o['Key'][len(sp):],
                                     CopySource={'Bucket': src, 'Key': o['Key']})
                      n += 1
              if n == 0:
                  raise Exception('no objects under s3://%s/%s' % (src, sp))
              return n
          def clean(b, pre=P):
              for pg in s3.get_paginator('list_object_versions').paginate(Bucket=b, Prefix=pre):
                  o = [{'Key': v['Key'], 'VersionId': v['VersionId']}
                       for v in pg.get('Versions', []) + pg.get('DeleteMarkers', [])]
                  for j in range(0, len(o), 1000):
                      s3.delete_objects(Bucket=b, Delete={'Objects': o[j:j + 1000], 'Quiet': True})
          def handler(e, c):
              p = e['ResourceProperties']
              b = p['Bucket']
              st, d, why = 'SUCCESS', {}, None
              try:
                  if 'SourceBucket' in p:
                      if e['RequestType'] == 'Delete':
                          clean(b, p['TargetPrefix'])
                      else:
                          d['FileCount'] = s3copy(p['SourceBucket'], b, p['SourcePrefix'], p['TargetPrefix'])
                  elif e['RequestType'] == 'Delete':
                      clean(b)
                  else:
                      d['FileCount'] = copy(b, p['Repository'], p['Ref'])
              except Exception as x:
                  print(repr(x))
                  if e['RequestType'] != 'Delete':
                      st, why = 'FAILED', str(x)[:500]
              cfnresponse.send(e, c, st, d, 'package-copy-' + b, reason=why)

  PackageCopy:
    Type: Custom::PackageCopy
    Condition: ShouldCopyPackage
    DependsOn:
      - ConnectS3BucketAppPolicy
      - PackageCopyRole
    Properties:
      ServiceToken: !GetAtt PackageCopyFunction.Arn
      Bucket: !Ref ConnectS3BucketApp
      Repository: !Ref PackageGitHubRepository
      Ref: !Ref PackageGitRef

  # -app バケットにコピー済みの sample_knowledge を -aiagents バケットへコピーする
  SampleKnowledgeCopy:
    Type: Custom::SampleKnowledgeCopy
    Condition: ShouldCopySampleKnowledge
    DependsOn:
      - PackageCopy
      - ConnectS3BucketAIagents
      - BucketPolicy
    Properties:
      ServiceToken: !GetAtt PackageCopyFunction.Arn
      SourceBucket: !Ref ConnectS3BucketApp
      SourcePrefix: 'amazon-connect-project/sample_knowledge/'
      Bucket: !Ref ConnectS3BucketAIagents
      TargetPrefix: 'sample_knowledge/'

Outputs:
  ConnectInstanceArn:
    Description: The ARN of the Amazon Connect instance
    Value: !If 
      - ShouldCreateNewInstance
      - !GetAtt ConnectInstance.Arn
      - !Sub 'arn:aws:connect:${AWS::Region}:${AWS::AccountId}:instance/${ExistingInstanceId}'
  
  ConnectAIagentsDomainArn:
    Condition: CreateAssistantResources
    Description: 'ARN of the created Connect AI agents domain'
    Value: !GetAtt Assistant.AssistantArn
  
  PhoneNumber:
    Condition: ShouldCreateNewInstanceAndClaimPhoneNumber
    Description: 'The phone number, in E.164 format.'
    Value: !GetAtt ConnectPhoneNumber.Address
  
  ConnectS3BucketName:
    Condition: ShouldCreateNewInstance
    Description: 'Name of the S3 bucket for Connect recordings'
    Value: !Ref ConnectS3Bucket
  
  ConnectAppS3BucketName:
    Description: 'Name of the S3 bucket for Connect Package'
    Value: !Ref ConnectS3BucketApp
  
  ConnectAIagentsS3BucketName:
    Condition: CreateAssistantResources
    Description: 'Name of the S3 bucket for Connect AI agents'
    Value: !Ref ConnectS3BucketAIagents
  
  CasesDomainId:
    Description: The Id of the Cases domain
    Value: !GetAtt AmazonConnectCases.DomainId
